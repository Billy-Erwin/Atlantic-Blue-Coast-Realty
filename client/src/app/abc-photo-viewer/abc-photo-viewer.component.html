<div id="photoViewerCarouselControls" class="carousel slide photoContainer" data-ride="carousel">
	<div class="carousel-inner">
		<div
			*ngFor="let photo of carouselPhotos"
			[ngClass]="{'carousel-item': true, 'active': photo.Primary}">
			<img src="{{photo.UriLarge}}" class="d-block img-fluid" alt="..." />
		</div>
	</div>
	<a class="carousel-control-prev" href="#photoViewerCarouselControls" role="button" data-slide="prev">
		<span class="carousel-control-prev-icon" aria-hidden="true"></span>
		<span class="sr-only">Previous</span>
	</a>
	<a class="carousel-control-next" href="#photoViewerCarouselControls" role="button" data-slide="next">
		<span class="carousel-control-next-icon" aria-hidden="true"></span>
		<span class="sr-only">Next</span>
	</a>
</div>
