<div class="container text-center">
	<div class="row">
		<div class="col-12">
			<abc-pagination [paginationObject]="paginationHash"></abc-pagination>
		</div>
	</div>
</div>
<div  *ngIf="listingsService.filteredListings.length > 0" class="container justify-content-center">
	<div class="row justify-content-left">
		<div *ngFor="let listing of listings; index as i">
			<div class="listing-card-wrapper">
				<abc-listing-card [listing]="listing"></abc-listing-card>
			</div>
		</div>
	</div>
</div>
