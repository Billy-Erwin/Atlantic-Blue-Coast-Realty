<div class="container">
	<div *ngIf="listings?.length" class="row justify-content-end">
		<div class="col-auto">
			<abc-pagination class="pull-right"></abc-pagination>
		</div>
		<div class="col-auto">
			<abc-sort-listings class="pull-right"></abc-sort-listings>
		</div>
	</div>
</div>
<div *ngIf="listings?.length" class="container">
	<div class="row justify-content-around" >
		<div *ngFor="let listing of listings; index as i">
			<div class="listing-card-wrapper">
				<abc-listing-card [listing]="listing"></abc-listing-card>
			</div>
		</div>
	</div>
</div>
<div class="container">
	<div *ngIf="listings?.length" class="row justify-content-end">
		<div class="col-auto">
			<abc-pagination class="pull-right"></abc-pagination>
		</div>
		<div class="col-auto">
			<abc-sort-listings class="pull-right"></abc-sort-listings>
		</div>
	</div>
</div>
