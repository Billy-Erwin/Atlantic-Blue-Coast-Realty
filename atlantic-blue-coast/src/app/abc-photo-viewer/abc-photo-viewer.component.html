<div id="carouselExampleControls" class="carousel slide photoContainer" data-ride="carousel">
	<div class="carousel-inner">
		<div
			*ngFor="let photo of listingPhotos"
			[ngClass]="{'carousel-item': true, 'active': photo.Primary}">
			<img src="{{photo.UriLarge}}" class="d-block w-100" alt="...">
		</div>
	</div>
	<a class="carousel-control-prev" href="#carouselExampleControls" role="button" data-slide="prev">
		<span class="carousel-control-prev-icon" aria-hidden="true"></span>
		<span class="sr-only">Previous</span>
	</a>
	<a class="carousel-control-next" href="#carouselExampleControls" role="button" data-slide="next">
		<span class="carousel-control-next-icon" aria-hidden="true"></span>
		<span class="sr-only">Next</span>
	</a>
</div>
<div class="photoNavWrapper">
	<div id="photoNavContainer">
		<div *ngFor="let photo of listingPhotos"
			data-target="#carouselExampleControls"
			style="display:inline-block !important;"
			attr.data-slide-to="{{listingPhotos.indexOf(photo)}}"
			[ngClass]="{'active': photo.Primary}">
			<img src="{{photo.UriThumb}}" class="thumbIndicator" alt="...">
		</div>
	</div>
</div>
