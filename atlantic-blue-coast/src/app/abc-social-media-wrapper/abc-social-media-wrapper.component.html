<div class="row container-fluid no-gutters">
	<div class="col-md-4">
		<span *ngFor="let socialMediaLink of ericSocialMediaLinks">
			<abc-social-media [socialMediaData]="socialMediaLink"></abc-social-media>
		</span>
	</div>
	<div class="col-md-4">
		<div
			id="slogan"
			class="abc-slogan"
			data-container="body"
			data-toggle="popover"
			data-placement="top"
			data-html="true">
			{{slogan}}
		</div>
	</div>
	<div class="col-md-4 text-md-right" >
		<span *ngFor="let socialMediaLink of socialMediaLinks">
			<abc-social-media [socialMediaData]="socialMediaLink"></abc-social-media>
		</span>
	</div>
</div>
