<div class="container-fluid listingsPageWrapper">
	<div class="listingsPageHeader row justify-content-center">{{title}}</div>
</div>
<div class="row justify-content-center my-lg-5 mx-lg-5">
	<div *ngIf="listingsService.abcListings.length > 0">
		<abc-listing-card-deck
			[title]="title"
			[listings]="listingsService.abcListings">
		</abc-listing-card-deck>
	</div>
</div>
